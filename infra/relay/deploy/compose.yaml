name: t3-private-relay
services:
  endpoints:
    image: caddy:2.10.2-alpine
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${T3_PRIVATE_CERT_DIR:?set existing certificate directory}:/certs:ro
    tmpfs:
      - /data
      - /config
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
